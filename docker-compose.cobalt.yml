# ============================================================
# SOCIAL HUB — Cobalt Media Downloader Docker Compose
# Repository: https://github.com/imputnet/cobalt.git
# ============================================================
#
# Quick Start:
#   docker compose -f docker-compose.cobalt.yml up -d
#
# API Endpoint:  http://localhost:9000
#
# Configure in .env:
#   COBALT_API_URL=http://localhost:9000
#   COBALT_API_KEY=
# ============================================================

version: '3.8'

services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: cobalt-downloader
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - '9000:9000'
    environment:
      - API_URL=http://localhost:9000/
      - PORT=9000
      - CORS_WILDCARD=1
