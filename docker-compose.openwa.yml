# ============================================================
# SOCIAL HUB — OpenWA WhatsApp API Gateway Docker Compose
# Repository: https://github.com/rmyndharis/OpenWA.git
# ============================================================
#
# Quick Start:
#   docker compose -f docker-compose.openwa.yml up -d
#
# API Endpoint:  http://localhost:2785/api
# Swagger Docs:  http://localhost:2785/docs
# Dashboard:     http://localhost:2785
# ============================================================

version: '3.8'

services:
  openwa-gateway:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: openwa-gateway
    restart: unless-stopped
    ports:
      - '2785:2785'
    environment:
      - NODE_ENV=production
      - PORT=2785
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=/app/data/openwa.sqlite
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/storage
      - CORS_ORIGINS=*
      - LOG_LEVEL=info
      - SWAGGER_ENABLED=true
    volumes:
      - openwa_data:/app/data
    security_opt:
      - seccomp:unconfined
    shm_size: '1gb'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2785/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  openwa_data:
    name: openwa_data
