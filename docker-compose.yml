# ============================================================
# SOCIAL HUB — Local Development Full Stack Docker Compose
# Services:
#   1. social-hub   (localhost:4000)
#   2. bgutil       (localhost:4416)
#   3. cobalt       (localhost:9000)
# ============================================================
#
# Quick Start:
#   docker compose up -d
#
# ============================================================

version: '3.8'

services:
  # Social Hub Main Web Application & API
  social-hub:
    build: .
    container_name: social-hub
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - NODE_ENV=development
      - BGUTIL_API_URL=http://bgutil:4416
      - COBALT_API_URL=http://cobalt:9000
      - INVIDIOUS_API_URL=https://inv.nadeko.net
    depends_on:
      - bgutil
      - cobalt
    volumes:
      - ./downloads:/app/downloads
      - ./uploads:/app/uploads
      - ./sessions:/app/sessions

  # BGUTIL PO Token Provider for yt-dlp
  bgutil:
    image: brainfucksec/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    restart: unless-stopped
    ports:
      - '4416:4416'

  # Cobalt Media Downloader API
  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: cobalt-downloader
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - '9000:9000'
    environment:
      - API_URL=http://localhost:9000/
      - PORT=9000
      - CORS_WILDCARD=1
