<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Downloader — YouTube & Instagram</title>
  <meta name="description" content="Download YouTube videos, Shorts, Music and Instagram Reels, Posts, and Carousels in original quality without cookies.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <div class="downloader-card">
      
      <!-- Card Header -->
      <div class="card-header">
        <div class="header-left">
          <div class="icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </div>
          <div class="header-text">
            <h1 class="card-title">Media Downloader</h1>
            <p class="card-subtitle">Fetch high quality videos &amp; reels from link</p>
          </div>
        </div>

        <!-- Platform Tabs / Badges -->
        <div class="platform-badges">
          <button type="button" class="tab-btn badge badge-yt active" id="tab-youtube" data-tab="youtube">
            <span class="badge-icon">▶</span>
            <span>YOUTUBE</span>
          </button>
          <button type="button" class="tab-btn badge badge-ig" id="tab-instagram" data-tab="instagram">
            <span class="badge-icon">◉</span>
            <span>INSTAGRAM</span>
          </button>
        </div>
      </div>

      <!-- Input Row -->
      <div class="input-row">
        <div class="input-wrapper">
          <svg class="globe-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <input 
            type="url" 
            id="url-input" 
            placeholder="Paste YouTube or Instagram link here..."
            autocomplete="off"
            spellcheck="false"
          />
          <button id="clear-btn" class="btn-clear" style="display:none" title="Clear input">✕</button>
        </div>

        <button class="btn-paste" id="paste-btn" type="button" title="Paste link from clipboard">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
          </svg>
          <span>Paste</span>
        </button>

        <button class="btn-download" id="download-btn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
            <path d="M5 21h14"/>
          </svg>
          <span id="download-btn-text">Download</span>
        </button>
      </div>

      <!-- Loading State -->
      <div id="loading-state" class="loading-state" style="display:none">
        <div class="progress-bar-track">
          <div class="progress-bar-fill"></div>
        </div>
        <div class="loading-text">
          <div class="spinner"></div>
          <span id="loading-message">Fetching high quality media without cookies…</span>
        </div>
      </div>

      <!-- Error State -->
      <div id="error-state" class="error-state" style="display:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="error-message"></span>
      </div>

      <!-- Result Card -->
      <div id="result-card" class="result-card" style="display:none">
        <div class="result-preview">
          <div class="thumbnail-wrapper">
            <img id="result-thumb" src="" alt="Thumbnail preview" />
            <span id="result-badge" class="result-badge">HD</span>
          </div>
          <div class="result-info">
            <h3 id="result-title" class="result-title"></h3>
            <div class="result-meta">
              <span id="result-author"></span>
              <span class="dot-separator" id="meta-separator">•</span>
              <span id="result-duration"></span>
            </div>
          </div>
        </div>

        <div class="download-section">
          <h4 class="section-heading">Download Options</h4>
          <div id="formats-grid" class="formats-grid"></div>
        </div>
      </div>

      <!-- Footer Info -->
      <div class="card-footer">
        <span>🔒 100% Anonymous &amp; Cookie-Free</span>
        <span class="dot-separator">•</span>
        <span>YouTube Videos, Shorts, Music &amp; Instagram Reels, Posts</span>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
