# ============================================================
# MEDIA DOWNLOADER — Render Deployment Blueprint
# ============================================================

services:
  - type: web
    name: media-downloader
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: INVIDIOUS_API_URL
        value: https://inv.nadeko.net
      - key: COBALT_API_URL
        sync: false
